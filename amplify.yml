version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm is broken in this project ("Exit handler never called!") on both
        # Windows and Amplify's Linux builder. Use pnpm via corepack instead.
        - corepack enable
        # Pin pnpm 9.x — pnpm 10 (@latest) hard-fails in CI on ignored build
        # scripts (ERR_PNPM_IGNORED_BUILDS: unrs-resolver). pnpm 9 only warns.
        - corepack prepare pnpm@9.12.0 --activate
        - pnpm config set verify-deps-before-run false
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        # Amplify SSR runtime doesn't see server-only env vars unless they're
        # written into .env.production at build time (AWS-documented fix).
        - env | grep -e SUPABASE_SERVICE_ROLE_KEY -e SUPABASE_URL -e SUPABASE_PUBLISHABLE_KEY -e GHL_PORTAL_EVENT_WEBHOOK_URL -e WEBINAR_ADMIN_EMAILS -e WEBINAR_EMBED_URL -e WEBINAR_REPLAY_URL -e CF_STREAM -e ANTHROPIC_API_KEY -e ANTHROPIC_MODEL >> .env.production || true
        - pnpm exec next build --no-lint
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
